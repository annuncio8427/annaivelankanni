<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="50%" stop-color="#133e68" />
      <stop offset="100%" stop-color="#071b2f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE182" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4CE" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="250" cy="250" r="236" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Marian 12 Stars on Ring Arch (Subtle) -->
  <g fill="#FCE182">
    <circle cx="250" cy="42" r="4" />
    <circle cx="200" cy="48" r="3.5" />
    <circle cx="300" cy="48" r="3.5" />
    <circle cx="154" cy="68" r="3.5" />
    <circle cx="346" cy="68" r="3.5" />
    <circle cx="114" cy="99" r="3" />
    <circle cx="386" cy="99" r="3" />
  </g>

  <!-- Laurel Wreath on Sides -->
  <g stroke="url(#goldGrad)" fill="url(#goldGrad)" stroke-width="1.5" opacity="0.9">
    <!-- Left Leaves -->
    <path d="M 100 240 C 90 280 110 340 160 380" fill="none" stroke-width="3" />
    <path d="M 94 220 Q 106 226 100 236 Q 92 230 94 220 Z" />
    <path d="M 88 245 Q 102 249 96 260 Q 86 254 88 245 Z" />
    <path d="M 86 275 Q 100 277 96 288 Q 84 284 86 275 Z" />
    <path d="M 92 305 Q 106 305 104 317 Q 90 315 92 305 Z" />
    <path d="M 104 335 Q 118 333 118 345 Q 104 345 104 335 Z" />
    <path d="M 124 362 Q 138 358 140 370 Q 126 372 124 362 Z" />
    <path d="M 150 384 Q 164 378 168 390 Q 154 394 150 384 Z" />

    <!-- Right Leaves -->
    <path d="M 400 240 C 410 280 390 340 340 380" fill="none" stroke-width="3" />
    <path d="M 406 220 Q 394 226 400 236 Q 408 230 406 220 Z" />
    <path d="M 412 245 Q 398 249 404 260 Q 414 254 412 245 Z" />
    <path d="M 414 275 Q 400 277 404 288 Q 416 284 414 275 Z" />
    <path d="M 408 305 Q 394 305 396 317 Q 410 315 408 305 Z" />
    <path d="M 396 335 Q 382 333 382 345 Q 396 345 396 335 Z" />
    <path d="M 376 362 Q 362 358 360 370 Q 374 372 376 362 Z" />
    <path d="M 350 384 Q 336 378 332 390 Q 346 394 350 384 Z" />
  </g>

  <!-- Central Crest Shield -->
  <path d="M 160 140 L 340 140 C 340 250 320 310 250 350 C 180 310 160 250 160 140 Z" 
        fill="#0b294a" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />

  <!-- Shield Inner Border -->
  <path d="M 170 150 L 330 150 C 330 245 312 298 250 336 C 188 298 170 245 170 150 Z" 
        fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6" />

  <!-- Upper Symbol: Torch / Lamp of Knowledge with Radiant Flame -->
  <g transform="translate(250, 185)">
    <!-- Torch Glow -->
    <circle cx="0" cy="-22" r="18" fill="#F59E0B" opacity="0.3" filter="url(#shadow)" />
    <!-- Flame -->
    <path d="M 0 -38 C 10 -28 14 -16 6 -8 C 0 -14 -6 -14 -8 -6 C -14 -16 -10 -28 0 -38 Z" fill="url(#goldLight)" />
    <!-- Torch Handle -->
    <path d="M -8 -6 L 8 -6 L 5 12 L -5 12 Z" fill="url(#goldGrad)" />
    <rect x="-10" y="-8" width="20" height="3" rx="1.5" fill="#FFF4CE" />
    <circle cx="0" cy="16" r="3" fill="#F59E0B" />
  </g>

  <!-- Central Symbol: Open Holy / Knowledge Book -->
  <g transform="translate(250, 245)">
    <!-- Book Pages -->
    <path d="M 0 0 C 15 -10 40 -12 60 -6 L 56 26 C 36 20 15 22 0 32 C -15 22 -36 20 -56 26 L -60 -6 C -40 -12 -15 -10 0 0 Z" 
          fill="#FFFDF7" stroke="#0a2540" stroke-width="1.5" />
    <!-- Book Spine & Details -->
    <path d="M 0 0 L 0 32" stroke="#B45309" stroke-width="2" />
    <!-- Page Lines Left -->
    <line x1="-48" y1="2" x2="-10" y2="-4" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="-48" y1="10" x2="-10" y2="4" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="-48" y1="18" x2="-10" y2="12" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Page Lines Right -->
    <line x1="10" y1="-4" x2="48" y2="2" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="10" y1="4" x2="48" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="10" y1="12" x2="48" y2="18" stroke="#94A3B8" stroke-width="1.5" />
  </g>

  <!-- Cross / Star Accent atop Shield -->
  <g transform="translate(250, 115)">
    <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="3" fill="#FFF" />
  </g>

  <!-- Established Ribbon Banner at Bottom -->
  <g transform="translate(250, 410)">
    <!-- Banner Shadow/Wings -->
    <path d="M -160 8 L -190 -12 L -190 20 L -160 30 Z" fill="#78350F" />
    <path d="M 160 8 L 190 -12 L 190 20 L 160 30 Z" fill="#78350F" />
    <!-- Banner Main Ribbon -->
    <path d="M -170 0 L 170 0 C 180 0 180 32 170 32 L -170 32 C -180 32 -180 0 -170 0 Z" fill="url(#goldGrad)" stroke="#FFF4CE" stroke-width="1" filter="url(#shadow)" />
    <text x="0" y="21" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="#0A2540" text-anchor="middle" letter-spacing="3">
      ESTD. 2004 • PAVOORCHATRAM
    </text>
  </g>

  <!-- Text Top Arc: ANNAI VELANKANNI MATRIC. HR. SEC. SCHOOL -->
  <path id="textArcTop" d="M 70 250 A 180 180 0 1 1 430 250" fill="none" />
  <text fill="#FFFDF5" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="19" font-weight="800" letter-spacing="3.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      ANNAI VELANKANNI MATRIC. HR. SEC. SCHOOL
    </textPath>
  </text>

  <!-- Text Bottom Subtitle -->
  <text x="250" y="470" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#FCE182" text-anchor="middle" letter-spacing="2">
    TRUTH • WISDOM • EXCELLENCE • DISCIPLINE
  </text>
</svg>

